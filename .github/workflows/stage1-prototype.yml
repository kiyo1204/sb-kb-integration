name: Research event integrity checks
on:
  push:
    branches: [main, 'codex/**', feature/stage1-research-prototype]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-research-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
      STAGE1_MOCK_DATA: ONLY_SYNTHETIC
      RESEARCH_BROWSER_CHECKS: '1'
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - name: Install disposable browser runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Static checks and builds
        run: |
          npm run typecheck --prefix backend
          npm run lint --prefix backend
          npm run build --prefix backend
          npm run typecheck --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend
      - name: Create a new mock database (never a repository DATABASE_URL)
        run: npm run db:mock --prefix backend -- create --name stage1_mock_ci --mock-data-only
      - name: Apply ordered migrations and verify reset protections
        run: |
          npm run db:mock --prefix backend -- migrate --name stage1_mock_ci
          npm run db:mock --prefix backend -- safety --name stage1_mock_ci
          npm run db:mock --prefix backend -- seed --name stage1_mock_ci
      - name: Empty legacy stream full API flow
        run: npm run db:mock --prefix backend -- check --name stage1_mock_ci
      - name: Catalog, v5 Link positions, v6 feedback, replay, delivery, export, deletion and browser suite
        run: npm run db:mock --prefix backend -- suite --name stage1_mock_ci
      - name: Upload aggregate mock results (no raw event data or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-research-event-checks
          path: |
            docs/issue13-suite-results.json
            docs/issue13-scale-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove only this job's dedicated mock container
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const path='.local/mock-reset/stage1_mock_ci.json';
          if(!existsSync(path))process.exit(0);
          const m=JSON.parse(readFileSync(path,'utf8'));
          if(m.name!=='stage1_mock_ci'||!/^[a-f0-9]{64}$/.test(m.containerId))throw new Error('unexpected mock manifest');
          const c=JSON.parse(execFileSync('docker',['inspect',m.containerId],{encoding:'utf8'}))[0];
          if(c.Id!==m.containerId||c.Config.Labels['stage1.purpose']!=='isolated-mock-reset'||c.Config.Labels['stage1.nonce']!==m.nonce)throw new Error('mock cleanup identity mismatch');
          execFileSync('docker',['rm','--force','--volumes',m.containerId],{stdio:'inherit'});
          NODE
